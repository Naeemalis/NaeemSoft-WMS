name: WMS database validation

on:
  push:
    branches: [main]
    paths:
      - "database/**"
      - ".github/workflows/database-validation.yml"
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/database-validation.yml"

jobs:
  postgres-schema-and-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naeemsoft_wms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naeemsoft_wms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d naeemsoft_wms_test -f "$migration"
          done

      - name: Run receipt approval smoke test
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d naeemsoft_wms_test -f database/tests/receipt_approval_smoke_test.sql
