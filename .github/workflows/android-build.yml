name: Build NaeemSoft-WMS Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper
        run: |
          flutter create --platforms=android --org com.naeemsoft --project-name naeemsoft_wms /tmp/naeemsoft_wms
          cp -R mobile/lib /tmp/naeemsoft_wms/
          cp mobile/pubspec.yaml /tmp/naeemsoft_wms/pubspec.yaml
          cp mobile/AndroidManifest.xml /tmp/naeemsoft_wms/android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        working-directory: /tmp/naeemsoft_wms
        run: flutter pub get

      - name: Analyze Flutter application
        working-directory: /tmp/naeemsoft_wms
        run: flutter analyze --no-pub

      - name: Build release APK
        working-directory: /tmp/naeemsoft_wms
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaeemSoft-WMS-Android-APK
          path: /tmp/naeemsoft_wms/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
