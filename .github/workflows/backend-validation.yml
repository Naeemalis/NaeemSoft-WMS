name: WMS backend validation

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-postgres-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naeemsoft_wms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naeemsoft_wms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client and API dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Apply PostgreSQL migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d naeemsoft_wms_test -f "$migration"
          done

      - name: Start API and bootstrap service account
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naeemsoft_wms_test
          WMS_API_KEY: test-only-api-key
          WMS_BASE_CURRENCY: USD
          PYTHONPATH: backend
        run: |
          python -m app.bootstrap
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/wms-api.log 2>&1 &
          echo $! > /tmp/wms-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wms-api.log
          exit 1

      - name: Test product, supplier and receipt lifecycle
        env:
          WMS_API_KEY: test-only-api-key
          WMS_TEST_URL: http://127.0.0.1:8000
        run: python backend/tests/smoke_test.py

      - name: Show API logs on failure
        if: failure()
        run: cat /tmp/wms-api.log || true
