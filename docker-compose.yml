services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naeemsoft_wms}
      POSTGRES_USER: ${POSTGRES_USER:-naeemsoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - wms_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naeemsoft} -d ${POSTGRES_DB:-naeemsoft_wms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-naeemsoft}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-naeemsoft_wms}
      WMS_API_KEY: ${WMS_API_KEY:?Set WMS_API_KEY in .env}
      WMS_BASE_CURRENCY: ${WMS_BASE_CURRENCY:?Set WMS_BASE_CURRENCY in .env}
      WMS_BASE_CURRENCY_NAME: ${WMS_BASE_CURRENCY_NAME:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  wms_postgres_data:
